<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center">

<div class="card">
  <h2>Patient Management</h2>
  <p>Nurse: <strong id="nurseName"></strong></p>

<select id="patients"></select>

  <input id="name" placeholder="Patient Name">
  <input id="bed" placeholder="Bed Number">
  <input id="fluid" placeholder="IV Fluid">
  <input id="totalML" placeholder="Total ML">
  <hr>
  <div id="alertBox" class="alertBox" style="display:none;"></div>

<p><strong>IV Fluid:</strong> <span id="displayFluid"></span></p>
<p><strong>Remaining:</strong> <span id="displayRemaining">-</span> ml</p>
<p><strong>Percentage:</strong> <span id="displayPercentage">-</span> %</p>
<p><strong>Status:</strong> <span id="displayStatus">-</span></p>


<button id="addBtn">Add</button>
<button id="newBagBtn">New Bag</button>
<button id="updateBtn">Update</button>
<button id="deleteBtn">Delete</button>
<button id="logoutBtn">Logout</button>



</div>

<script src="/socket.io/socket.io.js"></script>

<script src="script.js"></script>

<script>
const socket = io();

socket.on("patientUpdated", (data) => {
  const selectedId = document.getElementById("patients").value;

  if (selectedId === data.patientId) {

    document.getElementById("displayRemaining").innerText = data.remainingML;
    document.getElementById("displayPercentage").innerText = data.percentage;
    document.getElementById("displayStatus").innerText = data.status;

    const statusElement = document.getElementById("displayStatus");
    const alertBox = document.getElementById("alertBox");

    // إزالة الألوان القديمة
    statusElement.className = "";
    alertBox.style.display = "none";

    if (data.status === "Running") {
      statusElement.style.color = "green";
    }

    else if (data.status === "Low") {
      statusElement.style.color = "orange";

      alertBox.style.display = "block";
      alertBox.style.backgroundColor = "#fff3cd";
      alertBox.style.color = "#856404";
      alertBox.innerText = "⚠ IV Level Low";
    }

    else if (data.status === "Critical") {
      statusElement.style.color = "red";

      alertBox.style.display = "block";
      alertBox.style.backgroundColor = "#f8d7da";
      alertBox.style.color = "#721c24";
      alertBox.innerText = "🚨 CRITICAL: IV Almost Empty!";
    }

    else if (data.status === "Finished") {
      statusElement.style.color = "gray";

      alertBox.style.display = "block";
      alertBox.style.backgroundColor = "#e2e3e5";
      alertBox.style.color = "#383d41";
      alertBox.innerText = "IV Finished";
    }
  }
});
</script>


</body>
</html>
