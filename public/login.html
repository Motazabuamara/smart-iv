<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Smart IV Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-wrapper">

<div class="brand-title">Smart IV</div>

  <div class="brand-sub">Intelligent IV Monitoring System</div>

  <div class="login-card">
    
 <input id="username" placeholder="Username">

<div class="password-wrapper">
  <input id="password" type="password" placeholder="Password">

  <span id="loginEye" onclick="toggleLoginPassword()">
    👁
  </span>
</div>

<button type="button" id="loginBtn">Login</button>
    <p id="errorMsg"></p>
<a href="#" onclick="openForgot()" class="forgot-link">
  Forgot Password?
</a>  </div>

</div>

<!-- OTP MODAL -->
<div id="otpModal" class="otp-modal" style="display:none;">
  <div class="otp-box">

    <span onclick="closeModals()" style="cursor:pointer;float:right;">✖</span>

    <h3>Enter OTP</h3>

    <input id="otpInput" placeholder="Enter code">

    <!-- 🔥 يظهر فقط في reset -->
  <div class="password-wrapper" id="newPassWrapper" style="display:none;">
  <input id="newPassword" type="password" placeholder="New Password">
  <span onclick="toggleNewPassword()">👁</span>
</div>

<div class="password-wrapper" id="confirmPassWrapper" style="display:none;">
  <input id="confirmPassword" type="password" placeholder="Confirm Password">
  <span onclick="toggleConfirmPassword()">👁</span>
</div>
    <button id="verifyOtpBtn">Verify</button>

    <p id="otpMsg"></p>
  </div>
</div>

<!-- FORGOT MODAL -->
<div id="forgotModal" class="otp-modal" style="display:none;">
  <div class="otp-box">
    <span onclick="closeModals()" style="cursor:pointer;float:right;">✖</span>
    <h3>Reset Password</h3>

    <input id="forgotUsername" placeholder="Username">
    <input id="forgotPhone" placeholder="Phone (+962...)">

    <button onclick="sendResetOTP()">Send OTP</button>

    <p id="forgotMsg"></p>
  </div>
</div>

<script src="script.js"></script>
</body>

</html>
