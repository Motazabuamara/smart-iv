<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Smart IV Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<div class="dashboard"></div>

<div class="top-header">
  <div class="logo">
    💧 Smart <span>IV</span> Dashboard
  </div>

  <div class="header-right">
    <div class="nurse-box">
      Nurse: <strong id="nurseName"></strong>
    </div>

    <button id="logoutBtn">Logout</button>
  </div>
</div>
<body>

<audio id="alarmSound" preload="auto">
  <source src="alarm.mp3" type="audio/mpeg">
</audio>

<div class="dashboard">

  <!-- LEFT PANEL -->
  <div class="left-panel">

    <h2>Patient Management</h2>
    

    <select id="patients"></select>

    <input id="name" placeholder="Patient Name">
    <input id="bed" placeholder="Bed Number">
    <input id="fluid" placeholder="IV Fluid">
    <input id="totalML" placeholder="Total ML">

   <button class="btn green">
  <i class="fa-solid fa-plus icon"></i> Add
</button>

<button class="btn blue">
  <i class="fa-solid fa-droplet icon"></i> New Bag
</button>

<button class="btn orange">
  <i class="fa-solid fa-rotate icon"></i> Update
</button>

<button class="btn red">
  <i class="fa-solid fa-trash icon"></i> Delete
</button>

  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">

    <h2>IV Live Monitoring</h2>

    <div id="statusBanner" class="statusBanner">
      IV Running Normally
    </div>

    <div id="alertBox" class="alertBox" style="display:none;"></div>

    <div class="info-grid">
      <div class="info-card">
        <h4>IV Fluid</h4>
        <p id="displayFluid">-</p>
      </div>

      <div class="info-card">
        <h4>Remaining</h4>
        <p><span id="displayRemaining">-</span> ml</p>
      </div>

      <div class="info-card">
        <h4>Percentage</h4>
        <p><span id="displayPercentage">-</span> %</p>
      </div>

      <div class="info-card">
        <h4>Status</h4>
        <p id="displayStatus">-</p>
      </div>
    </div>

   <div class="progress-section">
  <h3>Progress Bar</h3>
  <div class="progress-container">
    <div id="progressBar" class="progress-bar"></div>
  </div>
</div>
    

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

<script>
const socket = io();
let lastAlertLevel = 100;

function unlockAudio() {
  const alarm = document.getElementById("alarmSound");
  alarm.play().then(() => {
    alarm.pause();
    alarm.currentTime = 0;
  }).catch(() => {});
  document.removeEventListener("click", unlockAudio);
  document.removeEventListener("keydown", unlockAudio);
  document.removeEventListener("touchstart", unlockAudio);
}
document.addEventListener("click", unlockAudio);
document.addEventListener("keydown", unlockAudio);
document.addEventListener("touchstart", unlockAudio);

socket.on("patientUpdated", (data) => {

  const selectedId = document.getElementById("patients").value;
  if (selectedId === data.patientId) {

    document.getElementById("displayRemaining").innerText = data.remainingML;
    document.getElementById("displayPercentage").innerText = data.percentage;
    document.getElementById("displayStatus").innerText = data.status;

    document.getElementById("progressBar").style.width = data.percentage + "%";

    const percentage = data.percentage;
    const alarm = document.getElementById("alarmSound");
    const alertLevels = [20, 15, 10, 5, 0];

    for (let level of alertLevels) {
      if (percentage <= level && lastAlertLevel > level) {
        alarm.play().catch(() => {});
        lastAlertLevel = level;
        break;
      }
    }

    const statusElement = document.getElementById("displayStatus");
    const alertBox = document.getElementById("alertBox");
    const banner = document.getElementById("statusBanner");

    alertBox.style.display = "none";

    if (data.status === "Running") {
      lastAlertLevel = 100;
      statusElement.style.color = "green";
      banner.className = "statusBanner running";
      banner.innerText = "IV Running Normally";
    }

    else if (data.status === "Low") {
      statusElement.style.color = "orange";
      banner.className = "statusBanner low";
      banner.innerText = "IV Level Low";

      alertBox.style.display = "block";
      alertBox.innerText = "⚠ IV Level Low";
    }

    else if (data.status === "Critical") {
      statusElement.style.color = "red";
      banner.className = "statusBanner critical";
      banner.innerText = "CRITICAL - IV Almost Empty!";

      alertBox.style.display = "block";
      alertBox.innerText = "🚨 CRITICAL: IV Almost Empty!";
    }

    else if (data.status === "Finished") {
      statusElement.style.color = "gray";
      banner.className = "statusBanner finished";
      banner.innerText = "IV Finished";

      alertBox.style.display = "block";
      alertBox.innerText = "IV Finished";
    }
  }
});
</script>

</body>
</html>
