<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Smart IV Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-wrapper">

<div class="brand-title">Smart IV</div>

  <div class="brand-sub">Intelligent IV Monitoring System</div>

  <div class="login-card">
    
 <input id="username" placeholder="Username">

<div class="password-wrapper">
  <input id="password" type="password" placeholder="Password">

  <span id="loginEye" onclick="toggleLoginPassword()">
    👁
  </span>
</div>

<button type="button" id="loginBtn">Login</button>
    <p id="errorMsg"></p>
  </div>

</div>

<div id="otpModal" class="otp-modal" style="display:none;">
  <div class="otp-box">
    <h3>Enter OTP</h3>
    <input id="otpInput" placeholder="Enter code">
    <button id="verifyOtpBtn">Verify</button>
  </div>
</div>

<script src="script.js"></script>
</body>

</html>
